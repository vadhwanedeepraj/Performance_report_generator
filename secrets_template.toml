# Streamlit Secrets — Email Dispatcher Pro
# ==========================================
# HOW TO USE:
#
# Option A — Streamlit Community Cloud:
#   1. Go to https://share.streamlit.io → Your App → Settings → Secrets
#   2. Paste the [smtp] section below with your real values
#   3. Save — the app will auto-load them on next restart
#
# Option B — Local / VPS deployment with secrets.toml:
#   1. Copy this file to: .streamlit/secrets.toml
#   2. Fill in your real values
#   3. NEVER commit secrets.toml to git (it's in .gitignore)
#
# ⚠️  .smtp_creds and .smtp_key are also secret — keep them out of git!
# ==========================================

[smtp]
email     = "your-email@gmail.com"
password  = "your-16-char-app-password"   # Gmail App Password (NOT your regular password)
from_name = "Your Display Name"
reply_to  = ""                             # optional, leave empty to use sender email
host      = "smtp.gmail.com"
port      = 587
provider  = "Gmail"
